<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="10 道情境題、約 5 分鐘，看見事情卡在哪裡，也看見不同的可能。">
<meta property="og:type" content="website">
<meta property="og:title" content="為什麼你的團隊，總是要你盯著才會動？｜合作卡點測驗">
<meta property="og:description" content="10 道情境題、約 5 分鐘，看見事情卡在哪裡，也看見不同的可能。">
<meta name="theme-color" content="#1F5A47">
<title>合作卡點測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single centered column (max 720px) on warm white; one-question-per-screen quiz; cards only where a thing is a separate object */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --sunk:#EEEDE6; --ink:#1D2220; --muted:#5A625E; --line:#DEDDD5;
  --accent:#1F5A47; --accent-ink:#FFFFFF; --accent-soft:#E3EDE8;
  --warn:#8A5A12; --warn-soft:#F5EDDC; --info:#2D5A86; --info-soft:#E3ECF5; --hyp:#7A4E8C; --hyp-soft:#F0E8F3;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1B201E; --sunk:#171C1A; --ink:#E8ECE9; --muted:#A1AAA5; --line:#2D3431;
  --accent:#71BF9F; --accent-ink:#0F1A15; --accent-soft:#1E2F28;
  --warn:#E2B66C; --warn-soft:#2D261A; --info:#8DB6E0; --info-soft:#1C2836; --hyp:#C9A3DA; --hyp-soft:#2A2030; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1B201E; --sunk:#171C1A; --ink:#E8ECE9; --muted:#A1AAA5; --line:#2D3431;
  --accent:#71BF9F; --accent-ink:#0F1A15; --accent-soft:#1E2F28;
  --warn:#E2B66C; --warn-soft:#2D261A; --info:#8DB6E0; --info-soft:#1C2836; --hyp:#C9A3DA; --hyp-soft:#2A2030; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:-.01em}
h2{font-size:clamp(21px,4.4vw,26px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.code{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
section.block{padding-block:44px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:16px;padding:14px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;line-height:1.4}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.sm{font-size:14px;padding:9px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.meta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.notice{border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.65;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice b{color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.t-user{background:var(--info-soft);color:var(--info)}
.t-rule{background:var(--accent-soft);color:var(--accent)}
.t-hyp{background:var(--hyp-soft);color:var(--hyp)}
.t-choice{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.t-demo{background:var(--warn-soft);color:var(--warn)}

/* Landing */
.hero{padding-block:44px 40px;display:flex;flex-direction:column;gap:22px}
.hero .sub{font-size:17px;color:var(--muted);max-width:34em}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.preview .opt{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--muted)}
.preview .opt.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.scene{padding:16px 18px;border-left:3px solid var(--line);background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.dimlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dimlist .row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.dimlist .row>div{min-width:0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.cmp ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.cmp .paid{border-color:var(--accent)}
.price{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}

.pains{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pains li{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500;line-height:1.6}
.pains li::before{content:"";flex:none;width:18px;height:18px;margin-top:4px;border-radius:5px;border:1.5px solid var(--accent);background:var(--accent-soft)}
.see h2{font-size:clamp(24px,5.4vw,30px)}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:j}
.journey li{counter-increment:j;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.journey li::before{content:counter(j);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
.journey b{font-size:18px}
.journey p{color:var(--muted);font-size:15px;min-width:0}
@media (max-width:520px){.btn.block-sm{width:100%}}

.codebox{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px dashed var(--accent);border-radius:8px}
.codebox b{font-family:var(--font-mono);font-size:24px;letter-spacing:.18em;color:var(--accent)}
.sharebox{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.7;user-select:all}
/* Quiz */
.qhead{padding-block:22px 6px;display:flex;flex-direction:column;gap:10px}
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.qcount{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbody{padding-block:18px;display:flex;flex-direction:column;gap:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;padding:16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.6}
.opt-btn:hover{border-color:var(--muted)}
.opt-btn .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.opt-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt-btn.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}

/* Result */
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar-row .lbl{font-size:15px;font-weight:500}
.bar-row .lvw{font-size:13px;color:var(--muted);white-space:nowrap}
.bar-row .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:4px;background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.bar-row.lv2 .track i{background:color-mix(in srgb,var(--accent) 60%,var(--sunk))}
.bar-row.lv3 .track i{background:var(--accent)}
.bar-row.lv3 .lbl{font-weight:700}
.bar-row.lv3 .lvw{color:var(--accent);font-weight:700}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gstep{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:26px}
.gstep:last-child{padding-bottom:0}
.gstep::before{content:"";position:absolute;left:13px;top:30px;bottom:4px;width:2px;background:var(--line)}
.gstep:last-child::before{display:none}
.gmark{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);position:relative}
.gcontent{min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.gcontent .tag{align-self:flex-start}
.gcontent h3{font-size:18px}
.gcontent p{font-size:16px;line-height:1.8}
.habits{margin:0;padding:12px 14px 12px 30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.7}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.compare b{font-size:16px}
.insight dt{font-weight:700;font-size:14px;color:var(--muted);margin-bottom:2px}
.insight dd{margin:0 0 14px}
.quote{font-size:18px;font-weight:500;line-height:1.7;padding-left:16px;border-left:3px solid var(--accent)}
.action{background:var(--accent-soft);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.cta{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}

/* Payment states */
.states{display:flex;flex-wrap:wrap;gap:6px}
.states span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.states span.now{border-color:var(--ink);color:var(--ink);font-weight:700}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(5px);user-select:none;pointer-events:none;opacity:.7}
.locked .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.locked .over span{background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}

/* Deep */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.steps i.done{background:var(--accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
label.f small{font-weight:400;color:var(--muted);font-size:13px}
textarea,input[type=text],input[type=email]{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.6}
textarea{min-height:96px;resize:vertical}
.hyp{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opcard{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.opcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opcard dl{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:0;font-size:14px}
.opcard dt{color:var(--muted)}
.opcard dd{margin:0;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.err{color:var(--warn);font-size:14px;font-weight:500}

/* Report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,5vw,36px);display:flex;flex-direction:column;gap:26px}
.rsec{display:flex;flex-direction:column;gap:8px}
.rsec h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rsec h3 .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:400}
.rsec .body{white-space:pre-wrap;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.plan{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plan div{display:grid;grid-template-columns:3.5em 1fr;gap:10px;padding-block:9px;border-bottom:1px solid var(--line);font-size:15px}
.plan b{font-family:var(--font-mono);font-size:13px;color:var(--accent);padding-top:2px}
.opt-table{overflow-x:auto}
.opt-table table{border-collapse:collapse;min-width:560px;font-size:14px;width:100%}
.opt-table th,.opt-table td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.opt-table th{color:var(--muted);font-weight:500;width:6em}
.opt-table td.chosen{background:var(--accent-soft)}

/* Status page */
.status-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.testrow{font-family:var(--font-mono);font-size:12.5px;display:flex;gap:8px}
.testrow .ok{color:var(--accent)} .testrow .bad{color:var(--warn)}
.evlog{font-family:var(--font-mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:12px;max-height:260px;overflow:auto;white-space:pre}
footer.foot{border-top:1px solid var(--line);padding-block:20px;font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:760px){.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:center}}
</style>
</head>
<body>


<header class="top"><div class="in">
  <button class="brand" data-action="go" data-view="landing"><i></i>合作卡點測驗</button>
  <button class="linkbtn" id="devlink" data-action="go" data-view="status" hidden>開發狀態</button>
</div></header>
<main id="app"></main>
<footer class="foot">本測驗為管理反思工具，不是經過科學驗證的評量</footer>

<!-- ============ CORE：資料、計分、測試（不依賴 DOM，可單獨測試） ============ -->
<script id="core">
const CONFIG = {
  price: 199,
  currency: '',  // 價格顯示為「199 元」
  // Google 試算表接收網址：照「資料收集設定說明」建立後，把網址貼在這裡。留空則不送出任何資料。
  sheetUrl: '',
  line: { id: '', addUrl: '' },  // 目前不使用
  devMode: /(^|#)dev$/.test(location.hash),
  features: { payment: false, email: false, pdf: false, linePush: false, aiProcessing: false }
};

const DIMENSIONS = {
  GOAL:     { name: '目標一致性', short: '大家對「要做到什麼、什麼最重要」的理解是否一致。' },
  ROLE:     { name: '角色與責任', short: '每件事是否有明確的負責人，大家對分工的理解是否相同。' },
  PROCESS:  { name: '工作流程',   short: '工作在交接、等待與檢查環節是否順暢。' },
  INFO:     { name: '資訊流通',   short: '需要的資訊是否能及時傳到需要的人手上。' },
  DECISION: { name: '決策與授權', short: '團隊知道自己能決定到什麼程度，事情不必都等你拍板。' }
};
const DIM_ORDER = ['GOAL','ROLE','PROCESS','INFO','DECISION'];

// kind: situational = 情境題（納入面向分析）；priority = 改善意願（分開呈現，不當作根因證據）
const QUESTIONS = [
  { id:'q1', kind:'situational', topic:'工作沒有如期完成', text:'當團隊工作沒有如期完成時，你通常會先做什麼？', options:[
    {key:'A', text:'確認負責人是否具備完成工作的能力', dim:'ROLE'},
    {key:'B', text:'自己介入處理，確保事情完成', dim:'DECISION'},
    {key:'C', text:'檢查流程或交接是否出現問題', dim:'PROCESS'},
    {key:'D', text:'重新確認目標、責任與完成標準', dim:'GOAL'}]},
  { id:'q2', kind:'situational', topic:'任務交辦', text:'當你把一項重要工作交給團隊夥伴時，最常遇到什麼情況？', options:[
    {key:'A', text:'對方不清楚最終成果應該長什麼樣子', dim:'GOAL'},
    {key:'B', text:'對方知道任務，卻不確定可以自行決定哪些事情', dim:'DECISION'},
    {key:'C', text:'對方需要等待其他人的資訊才能繼續', dim:'INFO'},
    {key:'D', text:'對方理解任務，但進度仍不如預期', dim:'PROCESS'}]},
  { id:'q3', kind:'situational', topic:'親自介入', text:'你最近一次必須親自介入工作，主要是因為什麼？', options:[
    {key:'A', text:'沒有人明確負責', dim:'ROLE'},
    {key:'B', text:'工作卡在某個交接環節', dim:'PROCESS'},
    {key:'C', text:'需要你做最後決定', dim:'DECISION'},
    {key:'D', text:'團隊對優先順序有不同理解', dim:'GOAL'}]},
  { id:'q4', kind:'situational', topic:'工作反覆修改', text:'當一項工作需要反覆修改時，最常見的原因是什麼？', options:[
    {key:'A', text:'一開始沒有說清楚完成標準', dim:'GOAL'},

const SCORING = {
  closeRatio: 0.85,       // 第二名標準化分數 ≥ 第一名的 85% → 視為接近，兩個一起呈現
  lowSignalMaxCount: 2    // 任一面向最多只被選 2 次 → 回答分散，提示需要用具體事件釐清
};

function scoreAnswers(answers){
  const counts = {}, opportunities = {};
  DIM_ORDER.forEach(d => { counts[d] = 0; opportunities[d] = 0; });
  QUESTIONS.filter(q => q.kind === 'situational').forEach(q => {
    new Set(q.options.map(o => o.dim)).forEach(d => opportunities[d]++);
    const a = answers[q.id];
    if (a) { const o = q.options.find(o => o.key === a); if (o) counts[o.dim]++; }
  });
  const complete = QUESTIONS.every(q => answers[q.id]);
  const normalized = {};
  DIM_ORDER.forEach(d => normalized[d] = opportunities[d] ? counts[d] / opportunities[d] : 0);
  // 排序：標準化分數 → 原始次數 → 固定順序（確保同分時結果可重現）
  const ranked = [...DIM_ORDER].sort((a,b) => normalized[b]-normalized[a] || counts[b]-counts[a] || DIM_ORDER.indexOf(a)-DIM_ORDER.indexOf(b));
  const maxN = normalized[ranked[0]];
  const relative = {};
  DIM_ORDER.forEach(d => relative[d] = maxN ? normalized[d] / maxN : 0);
  const close = maxN > 0 && normalized[ranked[1]] >= maxN * SCORING.closeRatio;
  const maxCount = Math.max(...DIM_ORDER.map(d => counts[d]));
  const lowSignal = maxCount <= SCORING.lowSignalMaxCount;
  const pq = QUESTIONS.find(q => q.kind === 'priority');
  const po = pq.options.find(o => o.key === answers[pq.id]);
  const priorityDim = po ? po.dim : null;
  return { complete, counts, opportunities, normalized, relative, ranked, top: ranked.slice(0,2), close, lowSignal, priorityDim, priorityMatchesTop: priorityDim === ranked[0] };
}

function runScoringTests(){
  const mk = s => { const o = {}; s.split('').forEach((k,i) => o['q'+(i+1)] = k); return o; };
  const cases = [
    { name:'全部選第 1 個選項：目標一致性最高', ans:mk('AAAAAAAAAA'), check:r => r.top[0]==='GOAL' },
    { name:'集中選授權相關：決策與授權最高、且不接近', ans:mk('BBCAADADCD'), check:r => r.top[0]==='DECISION' && !r.close },
    { name:'標準化：資訊流通選 4 次（共 5 題）勝過目標一致性選 5 次（共 9 題）', ans:mk('DCDCCAD'+'C'+'AA'), check:r => r.counts.GOAL===5 && r.counts.INFO===4 && r.top[0]==='INFO' },
    { name:'未答完：不能查看結果', ans:{q1:'A',q2:'B'}, check:r => r.complete===false },
    { name:'回答分散：顯示「回答分散」提示', ans:mk('AABCABACCA'), check:r => r.lowSignal===true },
    { name:'同樣答案兩次，排序相同（可重現）', ans:mk('ABCDABCDAB'), check:r => JSON.stringify(r.ranked)===JSON.stringify(scoreAnswers(mk('ABCDABCDAB')).ranked) },
    { name:'只改第 10 題，各面向次數不變', ans:mk('ABCDABCDAA'), check:r => JSON.stringify(r.counts)===JSON.stringify(scoreAnswers(mk('ABCDABCDAD')).counts) }
  ];
  return cases.map(c => { const r = scoreAnswers(c.ans); let pass = false; try { pass = !!c.check(r); } catch(e) {} return { name:c.name, pass }; });
}
if (typeof module !== 'undefined') module.exports = { scoreAnswers, runScoringTests, QUESTIONS };

  return `<div class="wrap"><div class="stack-lg" style="padding-top:32px">
  <div class="stack"><span class="eyebrow">內部使用</span><h1 style="font-size:28px">開發狀態</h1><p class="muted small">給你和開發者看的檢查頁，正式版應移除或隱藏。</p></div>
  <div class="card stack"><h3><span class="tag t-rule">目前版本（只有免費版）</span></h3>${L(['首頁 → 身分題 → 10 題情境題 → AI 感受題 → 結果頁','結果頁：分布圖、六步驟洞察、今天就能做的檢查、一週觀察三件事','名單收集：自願留下 Threads 帳號＋留言用的結果文字','資料收集：' + (CONFIG.sheetUrl ? '已設定 Google 試算表' : '尚未設定 Google 試算表，目前不會送出資料'),'從 #dev 進入時，送出的資料會標記為測試'])}</div>
  <div class="card stack"><h3><span class="tag t-choice">暫停中</span></h3>${L(['付費深度解析、報告、金流、電子郵件、LINE 官方帳號：程式保留，但沒有入口'])}</div>

  <div class="card stack"><h3>產品邏輯檢查</h3>${L([
    '<b>題目誘導</b>：第 1 題第 2 個選項「自己介入處理」是唯一描述你自己行為的選項，可能讓人覺得是壞答案而避開。建議改成中性描述，例如「先確保這次能如期交付」。',
    '<b>面向重疊</b>：第 1 題第 4 個選項同時寫了「目標、責任與完成標準」，卻只算目標一致性；第 5 題第 4 個選項、第 9 題第 2 個選項（能力與資源）歸到角色與責任，其實更接近「人與工作的適配」。第 7 題第 3 個選項「等待或交接」歸資訊流通，但交接也屬工作流程。',
    '<b>計分偏差</b>：第 1–9 題中目標一致性有 9 次被選的機會、資訊流通只有 5 次，已依出現次數調整；但資訊流通樣本少，選 2–3 次就容易排第一，結果需搭配次數一起看（結果頁已顯示）。',
    '<b>第 10 題對照</b>：第 10 題沒有資訊流通的選項（第 3 個選項合併了流程與資訊），所以結果偏資訊流通的人永遠無法得到「一致」的對照。建議拆成五個選項。',
    '<b>免費結果價值</b>：已提供具體的管理習慣觀察與一項 10–20 分鐘的檢查，不只是類型名稱。',
    '<b>付費版新成果</b>：付費版的價值來自使用者自己的真實事件、事實與推測的區分，以及選擇後的七日計畫；目前選項文案是依面向預寫，正式版可考慮依事件內容調整，但需標示為系統假設。',
    '<b>推測說成事實的風險</b>：結果頁的語氣使用「可能」「顯示」，報告每段標示來源；人事決定被列為預設的「暫時不做」選項。'])}</div>

  <div class="card stack"><h3>身分題的觀察方向</h3>
    <p class="small muted">開始測驗、完成測驗、點擊付費都會記下身分，可以比較各族群的人數、完成率、最常出現的面向與付費點擊率。每個族群累積約 30 人完成後再比較，結果比較可信。</p>
    ${ROLE_QUESTION.options.map((o,i)=>`<div style="border-top:1px solid var(--line);padding-top:10px"><b>${i+1}. ${o}</b><p class="small muted">包含：${ROLE_QUESTION.segments[i].who}</p><p class="small">假設：${ROLE_QUESTION.segments[i].hyp}</p></div>`).join('')}
  </div>

  <div class="card stack"><h3>計分測試（${tests.filter(t=>t.pass).length}/${tests.length} 通過）</h3>
    ${tests.map(t=>`<div class="testrow"><span class="${t.pass?'ok':'bad'}">${t.pass?'通過':'未通過'}</span><span>${esc(t.name)}</span></div>`).join('')}</div>

  <div class="card stack"><h3>本次事件紀錄（${state.events.length}）</h3>
    <p class="small muted">尚未串接分析工具，只保存在這個頁面中。下方是給工程師看的原始資料格式。</p>
    <div class="evlog">${state.events.length?state.events.map(e=>esc(JSON.stringify(e))).join('\n'):'尚無事件'}</div></div>
</div></div>`;
}

/* ---------- Render & events ---------- */
function render(){
  const v = { landing:vLanding, quiz:vQuiz, result:vResult, upgrade:vUpgrade, deep:vDeep, report:vReport, status:vStatus }[state.view];
  app.innerHTML = v();
}

function deepValidate(){
  const d = state.deep, s = state.deepStep;
  if (s === 0 && d.event.trim().length < 10) return '請先用一兩句話描述一件具體事件（至少 10 個字）。';
  if (s === 1 && !d.what.trim()) return '請至少填寫「具體發生了什麼」。';
  if (s === 3 && d.option === null) return '請選一個想先嘗試的改善做法。';
  return '';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t || t.disabled) return;
  const a = t.dataset.action;
  if (a === 'go') return go(t.dataset.view);
  if (a === 'start') { if (!result().complete) { state.qIndex = !state.role ? -1 : (Object.keys(state.answers).length ? state.qIndex : 0); } track('test_start'); return go('quiz'); }
  if (a === 'role') { state.role = ROLE_QUESTION.options[+t.dataset.i]; track('role_selected', { role: state.role }); sendRow('start'); render(); setTimeout(() => { if (state.view==='quiz' && state.qIndex===-1) { state.qIndex = 0; render(); } }, 260); return; }
  if (a === 'answer') {
    const q = QUESTIONS[state.qIndex]; state.answers[q.id] = t.dataset.key;
    track('question_answered', { question:q.id, answer:t.dataset.key });
    render();
    if (state.qIndex < QUESTIONS.length) setTimeout(() => { if (state.view==='quiz' && QUESTIONS[state.qIndex] && QUESTIONS[state.qIndex].id===q.id) { state.qIndex++; render(); } }, 260);
    return;
  }
  if (a === 'prev') { state.qIndex = Math.max(-1, state.qIndex-1); return render(); }
  if (a === 'next') { state.qIndex = Math.min(QUESTIONS.length, state.qIndex+1); return render(); }
  if (a === 'ai') { state.ai = AI_QUESTION.options[+t.dataset.i]; track('ai_feeling', { feeling: state.ai, role: state.role }); return render(); }
  if (a === 'finish') { if (!result().complete || !state.ai) return; track('test_complete', { top: result().top, role: state.role, ai: state.ai }); sendRow('complete'); return go('result'); }
  if (a === 'review') { state.qIndex = 0; return go('quiz'); }
  if (a === 'restart') { Object.assign(state, { answers:{}, role:null, ai:null, sid:newSid(), handle:'', leadOk:false, leadMsg:'', leadSent:false, qIndex:0, deep:freshDeep(), deepStep:0, demo:false, payment:'unpaid', email:'', emailOk:false, mktOk:false, emailMsg:'', copyMsg:'' }); return go('landing'); }
  if (a === 'upgrade') { track('upgrade_click', { role: state.role }); return go('upgrade'); }
  if (a === 'checkout') { track('checkout_start'); return; }
  if (a === 'demo') { state.demo = true; state.deepStep = 0; state.deepError=''; return go('deep'); }
  if (a === 'fillExample') { Object.assign(state.deep, EXAMPLE, { example:true }); return render(); }
  if (a === 'pickOption') { state.deep.option = +t.dataset.i; delete state.deep.notDo[t.dataset.i]; state.deepError=''; return render(); }
  if (a === 'deepPrev') { state.deepError=''; if (state.deepStep===0) return go('upgrade'); state.deepStep--; render(); return window.scrollTo({top:0}); }
  if (a === 'deepNext') {
    const err = deepValidate(); state.deepError = err; if (err) return render();
    if (state.deepStep === 4) return go('report');
    state.deepStep++; render(); return window.scrollTo({top:0});
  }
  if (a === 'editDeep') { state.deepStep = 0; return go('deep'); }
  if (a === 'copyReport') {
    const txt = reportText();
    const done = ok => { state.copyMsg = ok ? '已複製報告文字，可以貼到記事本或訊息中保存。' : '無法自動複製，請手動選取報告內容後複製。'; if (ok) track('report_download', { method:'copy' }); render(); };
    try { navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false)); } catch(_) { done(false); }
    return;
  }
  if (a === 'copyShare') {
    const txt = document.getElementById('shareText').innerText;
    const done = ok => { state.copyMsg = ok ? '已複製，回到 Threads 貼文貼上就可以了。' : '無法自動複製，請長按上面那句話手動複製。'; if (ok) track('share_copy'); render(); };
    try { navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false)); } catch(_) { done(false); }
    return;
  }
  if (a === 'followup') { track('followup_complete', { demo:true }); state.copyMsg = '已記錄 followup_complete 測試事件（可在「開發狀態」頁查看）。'; return render(); }
});

app.addEventListener('keydown', e => {
  const t = e.target.closest('.opcard'); if (t && (e.key==='Enter'||e.key===' ')) { e.preventDefault(); t.click(); }
});

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field) state.deep[t.dataset.field] = t.value;
  if (t.dataset.fieldRoot) state[t.dataset.fieldRoot] = t.value;
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.hyp) state.deep.hyp[t.dataset.hyp] = t.value;
  if (t.dataset.notdo) state.deep.notDo[t.dataset.notdo] = t.checked;
  if (t.dataset.root) state[t.dataset.root] = t.checked;
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'lead') {
    const v = state.handle.trim().replace(/^@?/, '@');
    if (!/^@[A-Za-z0-9._]{1,30}$/.test(v)) state.leadMsg = '帳號格式看起來不對，Threads 帳號只會有英文字母、數字、底線和句點。';
    else if (!state.leadOk) state.leadMsg = '請先勾選同意，才能送出。';
    else { state.handle = v; state.leadMsg = ''; state.leadSent = true; track('lead_submit', { role: state.role }); sendRow('lead', { handle: v }); }
    render(); if (state.leadSent) document.getElementById('lead')?.scrollIntoView({block:'center'});
    return;
  }
  if (e.target.dataset.form !== 'email') return;
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim());
  if (!ok) state.emailMsg = '<b>電子郵件格式不正確。</b>請確認是否包含「@」符號與完整的網域名稱。';
  else if (!state.emailOk) state.emailMsg = '<b>尚未勾選同意。</b>請勾選「同意以這個電子郵件接收本次報告」。';
  else {
    track('email_opt_in'); if (state.mktOk) track('marketing_opt_in');
    state.emailMsg = '<b>電子郵件寄送功能尚未啟用，報告沒有寄出。</b>你的同意已記錄在本頁的測試事件中，正式版會在串接寄信服務後寄送。';
  }
  render();
});

if (CONFIG.devMode) document.getElementById('devlink').hidden = false;
go('landing');
</script>

</body>
</html>
